name: Generate profile metrics

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): refresh profile graphics [skip ci]"
          output_action: commit
          user: Omar6661
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Casablanca
          filename: github-metrics/metrics.svg
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): refresh profile graphics [skip ci]"
          output_action: commit
          user: Omar6661
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          config_timezone: Africa/Casablanca
          filename: github-metrics/languages.svg
